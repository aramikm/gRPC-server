[package]
name = "opentest"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "High-throughput gRPC key-value service backed by RocksDB."
license = "MIT OR Apache-2.0"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
tonic = "0.12"
tonic-reflection = "0.12"
prost = "0.13"
rocksdb = { version = "0.22", default-features = false, features = ["snappy", "lz4", "zstd"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"

[build-dependencies]
tonic-build = "0.12"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "opentest"
path = "src/main.rs"

[lib]
name = "opentest"
path = "src/lib.rs"

[[bench]]
name = "throughput"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1
