services:
  # ============================================================
  # Kafka in KRaft mode (no ZooKeeper required)
  # ============================================================
  kafka:
    image: apache/kafka:3.7.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_KRAFT_CLUSTER_ID: "NjQyMzM1NzM0MzE3MDk0NTIyMg=="
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_LISTENERS: "CONTROLLER://0.0.0.0:29093,INTERNAL://0.0.0.0:29091,EXTERNAL://0.0.0.0:9092"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:29091,EXTERNAL://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_NODE_ID: 1
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "kafka:29091", "--list"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

  # ============================================================
  # gRPC Server
  # ============================================================
  grpc-server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "50051:50051"
    environment:
      - RUST_LOG=info
      - CONFIG_PATH=/app/config.toml
    volumes:
      - rocksdb-data:/app/data
      - ./config.toml:/app/config.toml:ro
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "50051"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ============================================================
  # Envoy gRPC-Web Proxy
  # ============================================================
  envoy:
    image: envoyproxy/envoy:v1.32-latest
    ports:
      - "8080:8080"   # gRPC-Web endpoint for browser
      - "9901:9901"   # Envoy admin interface (optional)
    volumes:
      - ./envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
    depends_on:
      grpc-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9901/server_info"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  rocksdb-data:
    driver: local
