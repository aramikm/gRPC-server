# Copy to `config.toml` (or point CONFIG_PATH at this file) to override defaults.
# Every section is optional; omitted values fall back to the built-in defaults.

[server]
address = "0.0.0.0:50051"
log_level = "info"            # respects $RUST_LOG when set
default_page_size = 100       # used when ListRequest.page_size == 0
max_page_size = 1000          # ListRequest.page_size is capped at this

[db]
path = "./data/rocksdb"
max_open_files = -1           # -1 = unlimited
write_buffer_size = 67108864  # 64 MiB
compression = "snappy"        # none | snappy | lz4 | zstd
create_if_missing = true
